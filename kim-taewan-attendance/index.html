<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="김태완 시간표">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://i.imgur.com/Mo4ogKc.png">
  <title>김태완 시간표</title>
  <style>
    :root {
      --bg: #f4f7f9;
      --panel: #ffffff;
      --line: #d9e2e8;
      --text: #17212b;
      --muted: #667789;
      --accent: #0f766e;
      --accent-soft: #e7f6f3;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --danger: #be123c;
      --shadow: 0 16px 40px rgba(22, 35, 50, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fbfcfd 0, var(--bg) 260px);
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(217, 226, 232, 0.92);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
    }

    .topbar-inner, main {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .school-mark {
      width: 54px;
      height: 54px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      margin-bottom: 5px;
      font-size: clamp(21px, 3vw, 30px);
      line-height: 1.1;
      font-weight: 900;
    }

    .subtitle {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .toolbar, .actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 11px;
      background: #fff;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 850;
      text-decoration: none;
    }

    .button:hover { border-color: #97a8b8; background: #f8fafc; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .button.primary:hover { background: #155e75; }
    .button.icon-only { width: 38px; padding: 0; }

    .icon {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    main {
      display: grid;
      gap: 14px;
      margin-top: 18px;
      margin-bottom: 38px;
    }

    .notice {
      border: 1px solid #c9e5e0;
      border-radius: 7px;
      padding: 10px 12px;
      background: var(--accent-soft);
      color: #16645e;
      font-size: 13px;
      font-weight: 750;
    }

    .notice.error {
      border-color: #fecdd3;
      background: #fff1f2;
      color: var(--danger);
    }

    .control-panel, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .control-panel {
      padding: 12px;
      display: grid;
      grid-template-columns: 175px minmax(240px, 1fr) auto;
      gap: 9px;
      align-items: center;
    }

    .field {
      height: 44px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .field input, .field select {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .panel-head {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-head h2 {
      margin-bottom: 4px;
      font-size: 19px;
      line-height: 1.2;
    }

    .panel-head p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .timetable-body { padding: 14px 16px 18px; }

    .date-band {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .date-label {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.2;
    }

    .date-sub {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .session-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .session-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      text-align: left;
      padding: 0;
    }

    .session-card:hover {
      border-color: rgba(15, 118, 110, 0.5);
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.1);
    }

    .session-card.empty {
      background: #f8fafc;
      color: var(--muted);
    }

    .session-head {
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .period-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      min-height: 26px;
      border-radius: 6px;
      background: #e2f2ef;
      color: #155e75;
      font-size: 12px;
      font-weight: 900;
    }

    .session-title {
      min-width: 0;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .session-body {
      padding: 10px 12px 12px;
      display: grid;
      gap: 8px;
    }

    .session-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .student-count {
      width: fit-content;
      white-space: nowrap;
      border: 1px solid rgba(15, 118, 110, 0.25);
      border-radius: 6px;
      background: #fff;
      color: var(--accent);
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 900;
    }

    .student-count:hover {
      border-color: var(--accent);
      background: #f0fdfa;
    }

    .session-card.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
    }

    .timetable-row.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
    }

    .timetable-grid {
      display: grid;
      gap: 8px;
    }

    .timetable-grid-head {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 132px;
      gap: 0;
      padding: 0 14px 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .timetable-row {
      width: 100%;
      min-height: 96px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 0;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 132px;
      overflow: hidden;
      text-align: left;
    }

    .timetable-row:hover {
      border-color: rgba(15, 118, 110, 0.45);
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.1);
    }

    .timetable-row.empty {
      opacity: 0.75;
    }

    .timetable-period {
      padding: 12px 10px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, #f8fafc 0, #eef7f4 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
    }

    .timetable-main {
      padding: 12px 14px;
      display: grid;
      align-content: center;
      gap: 6px;
      min-width: 0;
    }

    .timetable-title {
      font-size: 15px;
      line-height: 1.3;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .timetable-sub {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .timetable-side {
      padding: 12px 14px;
      border-left: 1px solid var(--line);
      background: #fbfdff;
      display: grid;
      align-content: center;
      justify-items: end;
      gap: 8px;
    }

    .timetable-side .student-count {
      justify-self: end;
    }

    .timetable-side-label {
      width: 100%;
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .empty-state {
      padding: 28px 12px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }

    .report-grid {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 14px;
      padding: 14px 16px 18px;
    }

    .report-filter {
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .report-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 11px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .tab-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .report-filter-group {
      display: grid;
      gap: 9px;
    }

    .report-filter-group + .report-filter-group {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .report-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .report-panel[data-mode="student"] .report-filter-group[data-mode="subject"],
    .report-panel[data-mode="student"] .report-filter-group[data-mode="date"] {
      display: none;
    }

    .report-panel[data-mode="subject"] .report-filter-group[data-mode="student"],
    .report-panel[data-mode="subject"] .report-filter-group[data-mode="date"] {
      display: none;
    }

    .report-panel[data-mode="date"] .report-filter-group[data-mode="student"],
    .report-panel[data-mode="date"] .report-filter-group[data-mode="subject"] {
      display: none;
    }

    .report-filter label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .report-filter input, .report-filter select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 9px;
      outline: 0;
      background: #fff;
      color: var(--text);
    }

    .report-filter input:focus, .report-filter select:focus {
      border-color: var(--accent);
    }

    .report-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }

    .report-stat {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px;
      background: #f8fafc;
    }

    .report-stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .report-stat strong {
      display: block;
      margin-top: 3px;
      font-size: 19px;
    }

    .report-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 440px;
    }

    .report-table th, .report-table td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      font-size: 12px;
    }

    .report-table th {
      background: #f8fafc;
      color: var(--muted);
      font-weight: 850;
    }

    .report-table tr:last-child td { border-bottom: 0; }

    .status-text {
      font-weight: 850;
    }

    .status-text.late { color: #b45309; }
    .status-text.absent { color: #be123c; }
    .status-text.leave { color: #6d28d9; }
    .status-text.pending { color: var(--muted); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.45);
    }

    .modal-backdrop.visible { display: flex; }

    .modal {
      width: min(720px, 100%);
      max-height: min(82vh, 760px);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.32);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      min-height: 62px;
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      min-width: 0;
    }

    .modal-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .modal-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .modal-body {
      padding: 14px 16px 16px;
      overflow: auto;
    }

    .modal-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary-item {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 10px;
      background: #f8fafc;
    }

    .summary-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .summary-item strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      line-height: 1;
    }

    .student-groups {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .student-group {
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }

    .student-group h3 {
      margin: 0;
      padding: 9px 11px;
      background: #f8fafc;
      font-size: 14px;
      line-height: 1.25;
    }

    .student-row {
      min-height: 49px;
      border-top: 1px solid var(--line);
      padding: 7px 10px;
      display: grid;
      grid-template-columns: minmax(80px, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .student-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 800;
    }

    .status-buttons {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      flex-wrap: wrap;
    }

    .status-button {
      min-width: 43px;
      min-height: 29px;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 0 5px;
      background: #fff;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .status-button:hover { border-color: var(--accent); color: var(--accent); }
    .status-button.active.late { border-color: #d97706; background: #fef3c7; color: #92400e; }
    .status-button.active.absent { border-color: #e11d48; background: #ffe4e6; color: #9f1239; }
    .status-button.active.leave { border-color: #7c3aed; background: #ede9fe; color: #5b21b6; }

    .loading {
      min-height: 100px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 800;
    }

    @media (max-width: 820px) {
      .topbar-inner, main { width: min(100% - 20px, 1160px); }
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 10px 0;
      }
      .school-mark { width: 46px; height: 46px; }
      h1 { font-size: 22px; }
      .toolbar { width: 100%; justify-content: flex-end; }
      main { margin-top: 10px; gap: 10px; }
      .control-panel { grid-template-columns: 1fr; }
      .session-grid { grid-template-columns: 1fr; }
      .report-grid { grid-template-columns: 1fr; }
      .modal-summary, .report-stats, .attendance-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .timetable-grid-head { display: none; }
      .timetable-row { grid-template-columns: 82px minmax(0, 1fr); min-height: 0; }
      .timetable-side { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); justify-items: start; grid-template-columns: auto auto; }
    }

    @media (max-width: 480px) {
      .topbar-inner, main { width: min(100% - 12px, 1160px); }
      .brand { gap: 9px; }
      .school-mark { width: 40px; height: 40px; }
      h1 { font-size: 19px; }
      .subtitle { font-size: 11px; }
      .button { min-height: 35px; font-size: 12px; }
      .button.icon-only { width: 35px; }
      .panel-head { padding: 12px; }
      .panel-head h2 { font-size: 16px; }
      .timetable-body { padding: 10px 12px 14px; }
      .date-band { margin-bottom: 10px; }
      .date-label { font-size: 15px; }
      .session-card { border-radius: 7px; }
      .session-head, .session-body { padding-left: 10px; padding-right: 10px; }
      .student-row {
        grid-template-columns: 1fr;
        gap: 5px;
        padding: 8px 9px;
      }
      .status-buttons { justify-content: flex-start; }
      .status-button { min-width: 48px; }
      .report-grid { padding: 10px 12px 14px; }
      .modal { max-height: 88vh; }
      .modal-head { padding: 12px; }
      .modal-body { padding: 12px; }
      .modal-summary, .report-stats { gap: 5px; }
      .summary-item, .report-stat { padding: 7px 6px; }
      .summary-item strong, .report-stat strong { font-size: 16px; }
      .timetable-row { grid-template-columns: 72px minmax(0, 1fr); }
      .timetable-period, .timetable-main, .timetable-side { padding: 9px 10px; }
    }

    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { background: #fff; }
      .topbar { position: static; background: #fff; border-bottom: 1px solid #cbd5e1; }
      .topbar-inner { width: 100%; min-height: 0; padding: 0 0 8px; }
      .school-mark { width: 42px; height: 42px; }
      h1 { font-size: 21px; }
      .subtitle { font-size: 11px; }
      .toolbar, .notice, .control-panel, .report-panel, .panel-head .actions, .modal-backdrop { display: none !important; }
      main { width: 100%; margin: 10px 0 0; display: block; }
      .panel { border: 1px solid #cbd5e1; border-radius: 0; box-shadow: none; }
      .panel-head { padding: 9px 10px; }
      .panel-head h2 { font-size: 16px; }
      .timetable-body { padding: 8px 10px 10px; }
      .session-grid { grid-template-columns: 1fr; gap: 7px; }
      .session-card { break-inside: avoid; }
      .session-head { padding: 8px 10px; }
      .session-body { padding: 8px 10px 10px; }
      .student-groups { gap: 7px; }
      .student-group h3 { padding: 6px 8px; font-size: 12px; }
      .student-row { min-height: 31px; padding: 4px 8px; grid-template-columns: 1fr auto; }
      .status-buttons { gap: 2px; }
      .status-button { min-width: 38px; min-height: 22px; padding: 0 3px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="school-mark" src="https://i.imgur.com/Mo4ogKc.png" alt="학교 마크">
        <div>
          <h1>김태완 시간표</h1>
          <p class="subtitle">학생 출결 입력과 학생별 조회</p>
        </div>
      </div>
      <div class="toolbar">
        <a class="button icon-only" href="../" title="전체 시간표" aria-label="전체 시간표">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
        </a>

  <script>
    const SHEET_ID = "1T1Dh0cqo3UwC_pkLpGBAVE5wIjJbOV8NMEWbCQ78qps";
    const SHEETS = { original: "원본(818)", enroll: "수강현황(818)" };
    const ROSTER_SHEETS = ["1h", "A~H", "2M", "3M", "3V"];
    const TEACHER = "김태완";
    const DAYS = ["월", "화", "수", "목", "금"];
    const DAY_STARTS = { 월: 4, 화: 12, 수: 20, 목: 28, 금: 36 };
    const PERIODS = ["1", "2", "3", "4", "5", "6", "7", "8"];
    const STATUS = [
      { key: "", label: "미입력", className: "pending" },
      { key: "지각", label: "지각", className: "late" },
      { key: "결석", label: "결석", className: "absent" },
      { key: "조퇴", label: "조퇴", className: "leave" }
    ];
    const FIXED_LESSONS = new Map([["월|1", "애국조회/학급회의"]]);
    const STORAGE_KEY = "kim-taewan-attendance-v2";
    const PLAIN_BLOCK_RE = /^[A-H]+$/;
    const GRADE_BLOCK_RE = /^([1-3](?:,[1-3])?)\/?([A-Za-z][A-Za-z0-9]*)$/;
    const REPORT_MODES = [
      { key: "student", label: "학생별" },
      { key: "date", label: "날짜별" },
      { key: "subject", label: "과목별" }
    ];

    const state = {
      teacher: null,
      enroll: new Map(),
      roster: new Map(),
      records: loadRecords(),
      selectedDate: dateKey(new Date()),
      reportMode: "student",
      reportDate: dateKey(new Date()),
      reportSubject: "",
      currentSession: null,
      students: [],
      subjects: [],
      loadedAt: null
    };

    const els = {
      statusBox: document.getElementById("statusBox"),
      refreshBtn: document.getElementById("refreshBtn"),
      printBtn: document.getElementById("printBtn"),
      reportBtn: document.getElementById("reportBtn"),
      reportJumpBtn: document.getElementById("reportJumpBtn"),
      dateInput: document.getElementById("dateInput"),
      prevDayBtn: document.getElementById("prevDayBtn"),
      todayBtn: document.getElementById("todayBtn"),
      nextDayBtn: document.getElementById("nextDayBtn"),
      timetableTitle: document.getElementById("timetableTitle"),
      timetableMeta: document.getElementById("timetableMeta"),
      selectedWeekdayLabel: document.getElementById("selectedWeekdayLabel"),
      timetableBody: document.getElementById("timetableBody"),
      reportPanel: document.getElementById("reportPanel"),
      reportTabs: Array.from(document.querySelectorAll("[data-report-mode]")),
      studentSearch: document.getElementById("studentSearch"),
      studentSelect: document.getElementById("studentSelect"),
      reportDateInput: document.getElementById("reportDateInput"),
      subjectSearch: document.getElementById("subjectSearch"),
      subjectSelect: document.getElementById("subjectSelect"),
      reportBody: document.getElementById("reportBody"),
      studentModal: document.getElementById("studentModal"),
      studentModalTitle: document.getElementById("studentModalTitle"),
      studentModalMeta: document.getElementById("studentModalMeta"),
      studentModalBody: document.getElementById("studentModalBody"),
      studentModalClose: document.getElementById("studentModalClose")
    };

    function normalize(value) {
      return String(value ?? "").replace(/\u3000/g, " ").replace(/\r/g, "\n").trim();
    }

    function compact(value) {
      return normalize(value).replace(/\s+/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(value) {
      return String(value ?? "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function cellValue(cell) {
      return normalize(cell?.f ?? cell?.v ?? "");
    }

    function subjectLabel(text) {
      const value = normalize(text);
      const match = value.match(/^(.+?)\((.+)\)$/);
      return match ? normalize(match[2]) : value;
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function localDate(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function formatDate(key) {
      const date = localDate(key);
      return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 (${["일", "월", "화", "수", "목", "금", "토"][date.getDay()]})`;
    }

    function dayName(key) {
      const day = localDate(key).getDay();
      return day >= 1 && day <= 5 ? DAYS[day - 1] : "";
    }

    function recordSubject(record) {
      if (record.subject || record.subjectLabel) return normalize(record.subject || record.subjectLabel);
      const session = state.teacher
        ? sessionsForDate(record.date).find((item) => item.key === record.sessionKey)
        : null;
      return normalize(sessionSubject(session) || record.section || record.sessionLabel || "기타");
    }

    function sessionSubject(session) {
      const subjects = [...new Set(session.lessons.map((lesson) => normalize(lesson.subject || subjectLabel(lesson.text) || lesson.text)).filter(Boolean))];
      return subjects.length === 1 ? subjects[0] : "";
    }

    function reportCountMap(records) {
      const counts = { 지각: 0, 결석: 0, 조퇴: 0 };
      records.forEach((record) => {
        if (counts[record.status] !== undefined) counts[record.status] += 1;
      });
      return counts;
    }

    function buildReportUI() {
      els.reportPanel.innerHTML = `
        <div class="panel-head">
          <div>
            <h2>출결 조회</h2>
            <p>학생, 날짜, 과목 기준으로 기록을 바로 볼 수 있습니다.</p>
          </div>
        </div>
        <div class="report-grid">
          <div class="report-filter">
            <div class="report-tabs">
              <button class="tab-button active" type="button" data-report-mode="student">학생별</button>
              <button class="tab-button" type="button" data-report-mode="date">날짜별</button>
              <button class="tab-button" type="button" data-report-mode="subject">과목별</button>
            </div>
            <div class="report-filter-group" data-mode="student">
              <label class="report-label" for="studentSearch">학생 검색</label>
              <input id="studentSearch" type="search" placeholder="이름 입력" autocomplete="off">
              <label class="report-label" for="studentSelect">학생 선택</label>
              <select id="studentSelect"></select>
            </div>
            <div class="report-filter-group" data-mode="date">
              <label class="report-label" for="reportDateInput">날짜 선택</label>
              <input id="reportDateInput" type="date">
            </div>
            <div class="report-filter-group" data-mode="subject">
              <label class="report-label" for="subjectSearch">과목 검색</label>
              <input id="subjectSearch" type="search" placeholder="과목명 입력" autocomplete="off">
              <label class="report-label" for="subjectSelect">과목 선택</label>
              <select id="subjectSelect"></select>
            </div>
          </div>
          <div id="reportBody">
            <div class="empty-state">기준을 선택하면 출결 기록이 표시됩니다.</div>
          </div>
        </div>
      `;
      els.reportTabs = Array.from(els.reportPanel.querySelectorAll("[data-report-mode]"));
      els.studentSearch = document.getElementById("studentSearch");
      els.studentSelect = document.getElementById("studentSelect");
      els.reportDateInput = document.getElementById("reportDateInput");
      els.subjectSearch = document.getElementById("subjectSearch");
      els.subjectSelect = document.getElementById("subjectSelect");
      els.reportBody = document.getElementById("reportBody");
      els.reportPanel.dataset.mode = state.reportMode;
      els.reportDateInput.value = state.reportDate;
    }

    function setReportMode(mode) {
      state.reportMode = mode;
      els.reportPanel.dataset.mode = mode;
      els.reportTabs.forEach((button) => {
        button.classList.toggle("active", button.dataset.reportMode === mode);
      });
      renderReport();
    }

    function loadRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
    }

    function setStatus(message, error = false) {
      els.statusBox.textContent = message;
      els.statusBox.classList.toggle("error", error);
    }

    function gvizLoad(sheetName) {
      return new Promise((resolve, reject) => {
        const callback = `__gviz_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const tqx = `out:json;responseHandler:${callback}`;
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=${encodeURIComponent(tqx)}&sheet=${encodeURIComponent(sheetName)}&cache=${Date.now()}`;
        const cleanup = () => {
          delete window[callback];
          script.remove();
        };
        window[callback] = (response) => {
          cleanup();
          if (response.status && response.status !== "ok") {
            reject(new Error(response.errors?.[0]?.detailed_message || response.status));
            return;
          }
          resolve(response.table);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error(`${sheetName} 시트를 불러오지 못했습니다.`));
        };
        script.src = url;
        document.head.appendChild(script);
      });
    }

    function tableRows(table) {
      return table.rows.map((row) => Array.from({ length: table.cols.length }, (_, index) => cellValue(row.c[index])));
    }

    function buildEnrollment(rows) {
      const map = new Map();
      rows.forEach((row) => {
        const gradeCell = normalize(row[1]).replace(/\.0$/, "");
        const subject = normalize(row[2]);
        const blockCell = compact(row[4]);
        const teacher = normalize(row[5]);
        const student = normalize(row[6]);
        const code = compact(row[8]);
        if (!subject || !teacher) return;

        let grades = "";
        let block = blockCell;
        const pattern = new RegExp(`^${escapeRegExp(compact(teacher))}([1-3](?:,[1-3])?|[1-3]{2,3})\\/?([A-Za-z][A-Za-z0-9]*)$`);
        const match = code.match(pattern);
        if (match) {
          grades = match[1].replace(/,/g, "");
          block = match[2];
        } else if (/^\d+$/.test(gradeCell) && block) {
          grades = gradeCell;
        }
        if (!grades || !block) return;

        const key = `${teacher}|${grades}|${block.toUpperCase()}`;
        if (!map.has(key)) map.set(key, { teacher, grades, block, subject, students: new Set() });
        if (student) map.get(key).students.add(student);
      });
      return map;
    }

    function buildRosterIndex(tableMap) {
      const index = new Map();
      ROSTER_SHEETS.forEach((sheetName) => {
        const rows = tableMap.get(sheetName);
        if (!rows?.length) return;
        rows[0].forEach((headerCell, columnIndex) => {
          const label = compact(headerCell);
          if (!label) return;
          const students = [...new Set(rows.slice(1).map((row) => normalize(row[columnIndex])).filter(Boolean))];
          index.set(`${sheetName.toLowerCase()}|${label.toLowerCase()}`, { sheetName, label, students });
        });
      });
      return index;
    }

    function addRosterSection(sections, sheetName, label) {
      const section = state.roster.get(`${sheetName.toLowerCase()}|${label.toLowerCase()}`);
      if (section && !sections.some((item) => item.sheetName === section.sheetName && item.label.toLowerCase() === section.label.toLowerCase())) {
        sections.push({ ...section });
      }
    }

    function collectLowercaseModules(token) {
      const sections = [];
      const add = (sheetName, label) => addRosterSection(sections, sheetName, label);
      const addNumbers = (grade, kind, digits) => {
        const sheetName = grade === "3" && kind === "v" ? "3V" : `${grade}M`;
        let rest = digits;
        while (rest) {
          const two = `${grade}${kind}${rest.slice(0, 2)}`;
          if (rest.length >= 2 && state.roster.has(`${sheetName.toLowerCase()}|${two.toLowerCase()}`)) {
            add(sheetName, two);
            rest = rest.slice(2);
          } else {
            add(sheetName, `${grade}${kind}${rest[0]}`);
            rest = rest.slice(1);
          }
        }
      };
      const pattern = /([23])?([mv])([0-9]+)/g;
      let currentGrade = "";
      let match;
      while ((match = pattern.exec(token.toLowerCase()))) {
        if (match[1]) currentGrade = match[1];
        if (currentGrade) addNumbers(currentGrade, match[2], match[3]);
      }
      return sections;
    }

    function collectRosterSections(token) {
      const cleaned = compact(token).replace(/\(.*\)$/, "");
      const sections = [];
      const exact = (label) => {
        state.roster.forEach((section) => {
          if (section.label.toLowerCase() === label.toLowerCase()) addRosterSection(sections, section.sheetName, section.label);
        });
      };
      exact(cleaned);
      if (sections.length) return sections;

      if (/^1h(10|[1-9])$/i.test(cleaned)) {
        addRosterSection(sections, "1h", `h${cleaned.replace(/^1h/i, "")}`);
        return sections;
      }

      if (/^[A-H]+$/.test(cleaned)) {
        cleaned.split("").forEach((letter) => addRosterSection(sections, "A~H", letter));
        return sections;
      }

      return collectLowercaseModules(cleaned);
    }

    function parseLessonFromEnrollment(grade, block, display) {
      const found = state.enroll.get(`${TEACHER}|${grade}|${block.toUpperCase()}`);
      const students = found ? [...found.students].sort((a, b) => a.localeCompare(b, "ko")) : [];
      const sections = students.length ? [{ label: display, students, source: "수강현황" }] : [];
      return {
        text: found ? `${display}(${found.subject})` : display,
        subject: found?.subject || "",
        students,
        sections
      };
    }

    function parseLessonFromBlock(block) {
      const candidates = [];
      state.enroll.forEach((item) => {
        if (item.teacher === TEACHER && item.block.toUpperCase() === block.toUpperCase()) candidates.push(item);
      });
      const subjects = [...new Set(candidates.map((item) => item.subject))];
      const students = [...new Set(candidates.flatMap((item) => [...item.students]))].sort((a, b) => a.localeCompare(b, "ko"));
      return {
        text: subjects.length === 1 ? `${block}(${subjects[0]})` : block,
        subject: subjects.length === 1 ? subjects[0] : "",
        students,
        sections: students.length ? [{ label: block, students, source: "수강현황" }] : []
      };
    }

    function parseRosterLesson(value) {
      const sections = collectRosterSections(value);
      const students = [...new Set(sections.flatMap((section) => section.students))];
      return { text: value, subject: "", students, sections };
    }

    function parseToken(token) {
      const value = compact(token);
      if (!value) return [];
      if (/^1h(10|[1-9])$/i.test(value) || PLAIN_BLOCK_RE.test(value) || /^[23][mv]\d/.test(value)) {
        return [parseRosterLesson(value)];
      }
      const gradeBlock = value.match(GRADE_BLOCK_RE);
      if (gradeBlock) return [parseLessonFromEnrollment(gradeBlock[1].replace(/,/g, ""), gradeBlock[2], `${gradeBlock[1].replace(/,/g, "")}${gradeBlock[2]}`)];
      return [parseLessonFromBlock(value)];
    }

    function parseSlot(raw) {
      const value = compact(raw);
      if (!value) return [];
      if (/애국|애조/.test(value)) {
        return [{ text: normalize(raw) || "애국조회/학급회의", subject: "", students: [], sections: [] }];
      }
      if (GRADE_BLOCK_RE.test(value) || /^[23][mv]\d/.test(value) || /^1h(10|[1-9])$/i.test(value) || PLAIN_BLOCK_RE.test(value)) {
        return parseToken(value);
      }
      return value.split(/[+,]/).filter(Boolean).flatMap((token) => parseToken(token));
    }

    function buildTeacher(rows) {
      const row = rows.slice(4).find((item) => normalize(item[2]) === TEACHER);
      if (!row) return null;
      const cells = [];
      DAYS.forEach((day) => {
        PERIODS.forEach((period, index) => {
          const fixed = FIXED_LESSONS.get(`${day}|${period}`);
          const raw = fixed || normalize(row[DAY_STARTS[day] + index]);
          cells.push({ day, period, raw, lessons: parseSlot(raw) });
        });
      });
      return { teacher: TEACHER, office: normalize(row[3]).replace(/\n+/g, " "), cells };
    }

    function sessionsForDate(key) {
      const day = dayName(key);
      if (!day || !state.teacher) return [];
      return state.teacher.cells
        .filter((cell) => cell.day === day)
        .map((cell) => ({
          ...cell,
          key: `${key}|${cell.period}`,
          label: `${cell.period}교시 · ${cell.lessons.map((lesson) => lesson.text).join(" · ") || cell.raw}`,
          dayName: day
        }))
        .filter((session) => session.raw);
    }

    function selectedSession() {
      return state.currentSession;
    }

    function recordKey(date, sessionKey, section, student) {
      return [date, sessionKey, section, student].join("|");
    }

    function getRecord(date, sessionKey, section, student) {
      return state.records[recordKey(date, sessionKey, section, student)] || null;
    }

    function getStatus(date, sessionKey, section, student) {
      return getRecord(date, sessionKey, section, student)?.status || "";
    }

    function setRecord(date, session, section, student, status) {
      const key = recordKey(date, session.key, section, student);
      if (!status) {
        delete state.records[key];
      } else {
        state.records[key] = {
          date,
          sessionKey: session.key,
          sessionLabel: session.label,
          subject: sessionSubject(session) || subjectLabel(session.label),
          day: session.dayName,
          period: session.period,
          section,
          student,
          status,
          updatedAt: new Date().toISOString()
        };
      }
    }

    function sessionGroups(session) {
      if (!session) return [];
      return session.lessons.flatMap((lesson) => {
        const sections = lesson.sections?.length ? lesson.sections : (lesson.students.length ? [{ label: lesson.text, students: lesson.students, source: "수강현황" }] : []);
        return sections.map((section) => ({
          label: section.label || lesson.text,
          subject: section.subject || lesson.subject || subjectLabel(lesson.text) || section.label || lesson.text,
          students: [...new Set(section.students)].sort((a, b) => a.localeCompare(b, "ko")),
          source: section.source || "수강현황"
        }));
      }).filter((group) => group.students.length);
    }

    function formatSessionTitle(session) {
      return session ? session.label : "수업 없음";
    }

    function renderTimetable() {
      const sessions = sessionsForDate(state.selectedDate);
      const date = localDate(state.selectedDate);
      const weekday = ["일", "월", "화", "수", "목", "금", "토"][date.getDay()];
      els.dateInput.value = state.selectedDate;
      els.timetableTitle.textContent = `김태완 시간표 · ${formatDate(state.selectedDate)}`;
      els.timetableMeta.textContent = state.teacher
        ? `${state.teacher.office || "교무실 정보 없음"} · ${state.loadedAt ? state.loadedAt.toLocaleString("ko-KR") : ""} 업데이트`
        : "교사 정보를 불러오는 중입니다.";
      els.selectedWeekdayLabel.textContent = `${weekday}요일`;

      if (!state.teacher) {
        els.timetableBody.innerHTML = `<div class="loading">시간표를 불러오는 중입니다.</div>`;
        return;
      }

      if (!sessions.length) {
        els.timetableBody.innerHTML = `<div class="empty-state">선택한 날짜(${formatDate(state.selectedDate)})에는 김태완 교사 수업이 없습니다.</div>`;
        return;
      }

      els.timetableBody.innerHTML = `
        <div class="timetable-grid">
          ${sessions.map((session) => {
            const groups = sessionGroups(session);
            const total = groups.reduce((sum, group) => sum + group.students.length, 0);
            const active = state.currentSession && state.currentSession.key === session.key;
            const marked = groups.reduce((sum, group) => sum + group.students.filter((student) => getStatus(state.selectedDate, session.key, group.label, student)).length, 0);
            return `
              <button class="timetable-row ${active ? "active" : ""} ${total ? "" : "empty"}" type="button" data-session-key="${escapeHtml(session.key)}">
                <div class="timetable-period">
                  <span class="period-badge">${escapeHtml(session.period)}교시</span>
                </div>
                <div class="timetable-main">
                  <div class="timetable-title">${escapeHtml(session.lessons.map((lesson) => lesson.text).join(" · ") || session.raw)}</div>
                  <div class="timetable-sub">${escapeHtml(session.label)} · ${state.teacher.teacher}</div>
                </div>
                <div class="timetable-side">
                  ${total ? `<span class="student-count">수강생 ${total}명</span><span class="timetable-side-label">${marked ? `출결 ${marked}명 기록` : "출결 미입력"}</span>` : `<span class="session-meta">수강생 명단 없음</span>`}
                </div>
              </button>
            `;
          }).join("")}
        </div>
      `;

      const openReportBtn = document.getElementById("openStudentReportBtn");
      if (openReportBtn) openReportBtn.addEventListener("click", () => els.reportPanel.scrollIntoView({ behavior: "smooth", block: "start" }));
    }

    function renderStudentModal(session) {
      const groups = sessionGroups(session);
      const total = groups.reduce((sum, group) => sum + group.students.length, 0);
      const counts = { 지각: 0, 결석: 0, 조퇴: 0 };
      groups.forEach((group) => group.students.forEach((student) => {
        const status = getStatus(state.selectedDate, session.key, group.label, student);
        if (counts[status] !== undefined) counts[status] += 1;
      }));

      els.studentModalTitle.textContent = formatSessionTitle(session);
      els.studentModalMeta.textContent = `${formatDate(state.selectedDate)} · ${state.teacher.teacher} · 수강인원 ${total}명`;
      els.studentModalBody.innerHTML = `
        <div class="modal-summary">
          <div class="summary-item"><span>전체</span><strong>${total}</strong></div>
          <div class="summary-item"><span>지각</span><strong>${counts["지각"]}</strong></div>
          <div class="summary-item"><span>결석</span><strong>${counts["결석"]}</strong></div>
          <div class="summary-item"><span>조퇴</span><strong>${counts["조퇴"]}</strong></div>
        </div>
        <div class="student-groups">
          ${groups.map((group) => `
            <section class="student-group">
              <h3>${escapeHtml(group.label)} · ${group.students.length}명</h3>
              ${group.students.map((student) => {
                const current = getStatus(state.selectedDate, session.key, group.label, student);
                return `
                  <div class="student-row">
                    <div class="student-name">${escapeHtml(student)}</div>
                    <div class="status-buttons">
                      ${STATUS.slice(1).map((item) => `
                        <button class="status-button ${item.className} ${current === item.key ? "active" : ""}" type="button" data-status="${item.key}" data-section="${escapeHtml(group.label)}" data-subject="${escapeHtml(group.subject)}" data-student="${escapeHtml(student)}">${item.label}</button>
                      `).join("")}
                    </div>
                  </div>
                `;
              }).join("")}
            </section>
          `).join("")}
        </div>
      `;
      els.studentModal.classList.add("visible");
      els.studentModalClose.focus();
    }

    function closeModal() {
      els.studentModal.classList.remove("visible");
      state.currentSession = null;
      renderTimetable();
    }

    function renderStudentOptions() {
      const query = normalize(els.studentSearch.value).toLowerCase();
      const current = els.studentSelect.value;
      const students = state.students.filter((student) => student.toLowerCase().includes(query));
      els.studentSelect.innerHTML = `<option value="">학생 선택</option>` + (students.length
        ? students.map((student) => `<option value="${escapeHtml(student)}">${escapeHtml(student)}</option>`).join("")
        : `<option value="">학생 없음</option>`);
      els.studentSelect.value = students.includes(current) ? current : "";
    }

    function renderSubjectOptions() {
      const query = normalize(els.subjectSearch.value).toLowerCase();
      const current = els.subjectSelect.value;
      const subjects = state.subjects.filter((subject) => subject.toLowerCase().includes(query));
      els.subjectSelect.innerHTML = `<option value="">과목 선택</option>` + (subjects.length
        ? subjects.map((subject) => `<option value="${escapeHtml(subject)}">${escapeHtml(subject)}</option>`).join("")
        : `<option value="">과목 없음</option>`);
      els.subjectSelect.value = subjects.includes(current) ? current : "";
    }

    function reportStats(records) {
      const counts = reportCountMap(records);
      return `
        <div class="report-stats">
          <div class="report-stat"><span>지각</span><strong>${counts["지각"]}</strong></div>
          <div class="report-stat"><span>결석</span><strong>${counts["결석"]}</strong></div>
          <div class="report-stat"><span>조퇴</span><strong>${counts["조퇴"]}</strong></div>
          <div class="report-stat"><span>기록</span><strong>${records.length}</strong></div>
        </div>
      `;
    }

    function reportRows(records, columns) {
      return records.map((record) => {
        const item = STATUS.find((status) => status.key === record.status) || STATUS[0];
        const values = columns.map((column) => {
          if (column.key === "date") return formatDate(record.date);
          if (column.key === "session") return record.sessionLabel;
          if (column.key === "subject") return recordSubject(record);
          if (column.key === "section") return record.section;
          if (column.key === "student") return record.student;
          if (column.key === "status") return `<span class="status-text ${item.className}">${item.label}</span>`;
          return "";
        });
        return `<tr>${values.map((value) => `<td>${value === `<span class="status-text ${item.className}">${item.label}</span>` ? value : escapeHtml(value)}</td>`).join("")}</tr>`;
      }).join("");
    }

    function renderReportTable(records, columns, emptyMessage) {
      if (!records.length) return `<div class="empty-state">${emptyMessage}</div>`;
      return `
        <div class="report-table-wrap">
          <table class="report-table">
            <thead><tr>${columns.map((column) => `<th>${column.label}</th>`).join("")}</tr></thead>
            <tbody>${reportRows(records, columns)}</tbody>
          </table>
        </div>
      `;
    }

    function renderReport() {
      if (!els.reportBody) return;
      if (state.reportMode === "date") {
        const date = els.reportDateInput?.value || state.reportDate;
        state.reportDate = date;
        const records = Object.values(state.records)
          .filter((record) => record.date === date)
          .sort((a, b) => a.period.localeCompare(b.period) || a.student.localeCompare(b.student, "ko"));
        els.reportBody.innerHTML = `
          ${reportStats(records)}
          ${renderReportTable(records, [
            { key: "session", label: "수업" },
            { key: "subject", label: "과목" },
            { key: "student", label: "학생" },
            { key: "status", label: "상태" }
          ], `${formatDate(date)}에 입력된 출결 기록이 없습니다.`)}
        `;
        return;
      }

      if (state.reportMode === "subject") {
        const subject = els.subjectSelect?.value || "";
        if (!subject) {
          els.reportBody.innerHTML = `<div class="empty-state">과목을 선택하면 과목별 출결 이력이 표시됩니다.</div>`;
          return;
        }
        const records = Object.values(state.records)
          .filter((record) => recordSubject(record) === subject)
          .sort((a, b) => b.date.localeCompare(a.date) || a.student.localeCompare(b.student, "ko"));
        els.reportBody.innerHTML = `
          ${reportStats(records)}
          ${renderReportTable(records, [
            { key: "date", label: "날짜" },
            { key: "session", label: "수업" },
            { key: "student", label: "학생" },
            { key: "status", label: "상태" }
          ], "입력된 과목별 출결 기록이 없습니다.")}
        `;
        return;
      }

      const student = els.studentSelect?.value || "";
      if (!student) {
        els.reportBody.innerHTML = `<div class="empty-state">학생을 선택하면 출결 이력이 표시됩니다.</div>`;
        return;
      }
      const records = Object.values(state.records)
        .filter((record) => record.student === student)
        .sort((a, b) => b.date.localeCompare(a.date) || b.period.localeCompare(a.period));
      els.reportBody.innerHTML = `
        ${reportStats(records)}
        ${renderReportTable(records, [
          { key: "date", label: "날짜" },
          { key: "session", label: "수업" },
          { key: "subject", label: "과목" },
          { key: "status", label: "상태" }
        ], "입력된 출결 기록이 없습니다.")}
      `;
    }

    function updateStatus(entry, session, status) {
      const key = recordKey(state.selectedDate, session.key, entry.section, entry.student);
      const current = getRecord(state.selectedDate, session.key, entry.section, entry.student)?.status || "";
      if (current === status) {
        delete state.records[key];
      } else {
        state.records[key] = {
          date: state.selectedDate,
          sessionKey: session.key,
          sessionLabel: session.label,
          subject: entry.subject || sessionSubject(session) || subjectLabel(session.label),
          day: session.dayName,
          period: session.period,
          section: entry.section,
          student: entry.student,
          status,
          updatedAt: new Date().toISOString()
        };
      }
      saveRecords();
      renderStudentModal(session);
      renderReport();
    }

    function openSession(key) {
      const session = sessionsForDate(state.selectedDate).find((item) => item.key === key);
      if (!session) return;
      state.currentSession = session;
      renderTimetable();
      renderStudentModal(session);
    }

    function moveDate(days) {
      const date = localDate(state.selectedDate);
      date.setDate(date.getDate() + days);
      state.selectedDate = dateKey(date);
      state.currentSession = null;
      renderTimetable();
    }

    function selectToday() {
      state.selectedDate = dateKey(new Date());
      state.currentSession = null;
      renderTimetable();
    }

    function exportCsv() {
      const session = selectedSession();
      if (!session) return;
      const groups = sessionGroups(session);
      const rows = [["날짜", "교시", "수업", "구간", "학생", "상태"]];
      groups.forEach((group) => group.students.forEach((student) => {
        rows.push([state.selectedDate, session.period, session.label, group.label, student, getStatus(state.selectedDate, session.key, group.label, student) || "미입력"]);
      }));
      const csv = rows.map((row) => row.map((value) => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\r\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `김태완_${state.selectedDate}_${session.period}교시_출결.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    async function loadData() {
      els.refreshBtn.disabled = true;
      setStatus("Google Sheet에서 김태완 교사 시간표와 수강생 명단을 불러오는 중입니다.");
      try {
        const [originalTable, enrollTable, ...rosterTables] = await Promise.all([
          gvizLoad(SHEETS.original),
          gvizLoad(SHEETS.enroll),
          ...ROSTER_SHEETS.map((sheetName) => gvizLoad(sheetName))
        ]);
        const rosterMap = new Map(ROSTER_SHEETS.map((sheetName, index) => [sheetName, tableRows(rosterTables[index])]));
        state.roster = buildRosterIndex(rosterMap);
        state.enroll = buildEnrollment(tableRows(enrollTable));
        state.teacher = buildTeacher(tableRows(originalTable));
        if (!state.teacher) throw new Error("원본 시트에서 김태완 교사를 찾지 못했습니다.");
        state.students = [...new Set(state.teacher.cells.flatMap((cell) => cell.lessons.flatMap((lesson) => lesson.students)))].sort((a, b) => a.localeCompare(b, "ko"));
        state.subjects = [...new Set([
          ...state.teacher.cells.flatMap((cell) => cell.lessons.map((lesson) => lesson.subject || subjectLabel(lesson.text))),
          ...Object.values(state.records).map((record) => recordSubject(record))
        ].map(normalize).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
        state.loadedAt = new Date();
        setStatus(`김태완 시간표와 수강생 명단을 불러왔습니다. ${state.loadedAt.toLocaleTimeString("ko-KR")} 기준`);
        buildReportUI();
        renderTimetable();
        renderStudentOptions();
        renderSubjectOptions();
        renderReport();
      } catch (error) {
        console.error(error);
        setStatus(`데이터를 불러오지 못했습니다. ${error.message}`, true);
        els.timetableBody.innerHTML = `<div class="empty-state">Google Sheet 공유 권한과 탭 이름을 확인하세요.</div>`;
      } finally {
        els.refreshBtn.disabled = false;
      }
    }

    els.dateInput.addEventListener("change", () => {
      state.selectedDate = els.dateInput.value || dateKey(new Date());
      state.currentSession = null;
      renderTimetable();
    });
    els.prevDayBtn.addEventListener("click", () => moveDate(-1));
    els.todayBtn.addEventListener("click", selectToday);
    els.nextDayBtn.addEventListener("click", () => moveDate(1));
    els.reportBtn.addEventListener("click", () => els.reportPanel.scrollIntoView({ behavior: "smooth", block: "start" }));
    els.reportJumpBtn.addEventListener("click", () => els.reportPanel.scrollIntoView({ behavior: "smooth", block: "start" }));
    document.addEventListener("click", (event) => {
      const tab = event.target.closest("[data-report-mode]");
      if (!tab) return;
      setReportMode(tab.dataset.reportMode);
    });
    document.addEventListener("input", (event) => {
      if (event.target === els.studentSearch) {
        renderStudentOptions();
        renderReport();
      }
      if (event.target === els.subjectSearch) {
        renderSubjectOptions();
        renderReport();
      }
      if (event.target === els.reportDateInput) {
        state.reportDate = event.target.value || dateKey(new Date());
        renderReport();
      }
    });
    document.addEventListener("change", (event) => {
      if (event.target === els.studentSelect) renderReport();
      if (event.target === els.subjectSelect) renderReport();
    });
    els.refreshBtn.addEventListener("click", loadData);
    els.printBtn.addEventListener("click", () => window.print());
    els.studentModalClose.addEventListener("click", closeModal);
    els.studentModal.addEventListener("click", (event) => {
      if (event.target === els.studentModal) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });
    els.timetableBody.addEventListener("click", (event) => {
      const target = event.target.closest("[data-session-key]");
      if (!target) return;
      openSession(target.dataset.sessionKey);
    });
    els.studentModalBody.addEventListener("click", (event) => {
      const button = event.target.closest(".status-button");
      if (!button || !state.currentSession) return;
      updateStatus(
        { section: button.dataset.section, subject: button.dataset.subject, student: button.dataset.student },
        state.currentSession,
        button.dataset.status
      );
    });

    buildReportUI();
    renderTimetable();
    loadData();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => console.warn("Service worker registration failed", error));
      });
    }
  </script>
</body>
</html>
