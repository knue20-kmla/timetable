<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026-2학기 교사 시간표</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-2: #f0f4f7;
      --line: #d7e0e8;
      --text: #182230;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-2: #155e75;
      --accent-soft: #e7f6f3;
      --warm: #c2410c;
      --warm-soft: #fff7ed;
      --danger: #be123c;
      --shadow: 0 18px 48px rgba(29, 41, 57, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fbfcfd 0, var(--bg) 230px);
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(215, 224, 232, 0.9);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      width: min(1220px, calc(100% - 32px));
      min-height: 78px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .school-mark {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-copy { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(21px, 3vw, 31px);
      line-height: 1.12;
      font-weight: 900;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      color: var(--text);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .button.icon-only {
      width: 38px;
      padding: 0;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .button:hover {
      border-color: #aab7c5;
      background: #f8fafc;
    }

    .button.primary:hover {
      border-color: var(--accent-2);
      background: var(--accent-2);
    }

    .button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    main {
      width: min(1220px, calc(100% - 32px));
      margin: 20px auto 42px;
      display: grid;
      gap: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr) minmax(190px, 1fr) minmax(135px, 0.62fr) minmax(135px, 0.62fr);
      gap: 10px;
      align-items: center;
    }

    .field {
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .field input, .field select {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .calendar-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
      box-shadow: 0 10px 30px rgba(29, 41, 57, 0.07);
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .calendar-toggle {
      min-height: 34px;
      margin: 0;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      text-align: left;
    }

    .calendar-toggle:hover { color: var(--accent); }

    .calendar-toggle .icon {
      transition: transform 180ms ease;
    }

    .calendar-panel.is-collapsed .calendar-toggle .icon {
      transform: rotate(-90deg);
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 900;
    }

    .calendar-actions {
      display: flex;
      gap: 6px;
    }

    .calendar-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .calendar-button.today-button {
      width: auto;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 900;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .calendar-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 180ms ease, opacity 150ms ease;
    }

    .calendar-body-inner {
      min-height: 0;
      overflow: hidden;
    }

    .calendar-panel.is-collapsed .calendar-head { margin-bottom: 0; }
    .calendar-panel.is-collapsed .calendar-body {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }

    .calendar-weekday {
      padding: 3px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .calendar-day {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .calendar-day:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .calendar-day.other-month { color: #a5b0bc; }

    .calendar-day.today {
      border-color: rgba(15, 118, 110, 0.45);
      color: var(--accent);
    }

    .calendar-day.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 10px rgba(15, 118, 110, 0.2);
    }

    .calendar-day.sunday { color: #c2410c; }
    .calendar-day.selected.sunday { color: #fff; }

    th.selected-day {
      background: #1d4ed8;
      color: #fff;
      box-shadow: inset 0 -4px 0 #0f2f86;
    }

    td.selected-day {
      background: #dbeafe;
      box-shadow: inset 3px 0 0 #2563eb, inset -3px 0 0 #2563eb;
    }

    td.selected-day .lesson:not(.empty) {
      border: 2px solid #2563eb;
      background: linear-gradient(180deg, #ffffff, #eff6ff);
      box-shadow: 0 3px 0 rgba(29, 78, 216, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    td.selected-day .lesson.empty {
      color: #2563eb;
    }

    .day-card.selected-day-card {
      border: 2px solid #2563eb;
      background: #eff6ff;
      box-shadow: 0 12px 34px rgba(37, 99, 235, 0.22);
    }

    .day-card.selected-day-card .day-title {
      background: #1d4ed8;
      color: #fff;
    }

    .day-card.selected-day-card .lesson:not(.empty) {
      border: 2px solid #2563eb;
      background: linear-gradient(180deg, #ffffff, #eff6ff);
    }

    .status {
      display: none;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px 14px;
      color: var(--muted);
      font-weight: 800;
      align-items: center;
      gap: 10px;
    }

    .status.visible { display: flex; }
    .status.error {
      border-color: rgba(190, 18, 60, 0.3);
      background: #fff1f2;
      color: var(--danger);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #cbd5e1;
      border-top-color: var(--accent);
      border-radius: 999px;
      animation: spin 0.8s linear infinite;
      flex: 0 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .table-wrap {
      position: relative;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .table-wrap::after {
      content: "";
      position: absolute;
      inset: 68px 0 0;
      z-index: 2;
      background-image: url("https://i.imgur.com/Mo4ogKc.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: min(340px, 42%);
      opacity: 0.045;
      pointer-events: none;
    }

    table {
      position: relative;
      z-index: 1;
      width: 100%;
      min-width: 880px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th, td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }

    th {
      height: 52px;
      background: linear-gradient(180deg, #f8fafc, var(--panel-2));
      color: #334155;
      font-size: 14px;
      font-weight: 900;
      text-align: center;
      vertical-align: middle;
    }

    .period {
      width: 72px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      vertical-align: middle;
    }

    .slot {
      min-height: 90px;
      padding: 10px;
      background: #fff;
      text-align: center;
    }

    .lesson {
      min-height: 78px;
      border: 1px solid rgba(15, 118, 110, 0.2);
      border-radius: 8px;
      background: linear-gradient(180deg, #f6fffd, var(--accent-soft));
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .lesson.empty {
      border-color: transparent;
      background: transparent;
      color: #a0acb9;
      align-items: center;
      font-weight: 800;
    }

    .lesson-title {
      font-size: 15px;
      line-height: 1.32;
      font-weight: 900;
      overflow-wrap: anywhere;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .lesson-sub {
      color: #536274;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
      overflow-wrap: anywhere;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .student-button {
      width: fit-content;
      border: 1px solid rgba(15, 118, 110, 0.25);
      border-radius: 8px;
      background: #ffffff;
      color: var(--accent);
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .student-button:hover {
      border-color: var(--accent);
      background: #f0fdfa;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.45);
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal {
      width: min(520px, 100%);
      max-height: min(680px, calc(100vh - 36px));
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.32);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      min-height: 62px;
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      min-width: 0;
    }

    .modal-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .modal-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .student-list {
      margin: 0;
      padding: 14px 16px 16px 34px;
      overflow: auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      font-weight: 750;
    }

    .student-group {
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      padding: 10px 12px;
      margin: 0;
    }

    .student-group h3 {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.25;
    }

    .student-group ol {
      margin: 0;
      padding-left: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 18px;
    }

    .mobile-list { display: none; gap: 12px; }

    .day-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(29, 41, 57, 0.08);
    }

    .day-title {
      margin: 0;
      padding: 12px 14px;
      background: linear-gradient(180deg, #f8fafc, var(--panel-2));
      font-size: 16px;
      font-weight: 900;
      text-align: center;
    }

    .mobile-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 10px;
      padding: 11px 12px;
      border-top: 1px solid var(--line);
    }

    .mobile-period {
      color: var(--muted);
      font-weight: 900;
      text-align: center;
      padding-top: 10px;
    }

    @media (max-width: 860px) {
      .topbar-inner, main { width: min(100% - 20px, 1220px); }

      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
        min-height: 0;
        padding: 10px 0;
      }

      .brand-lockup { gap: 10px; }
      .school-mark { width: 42px; height: 42px; }
      h1 { font-size: 22px; }
      .subtitle { margin-top: 4px; font-size: 12px; }
      .toolbar { width: 100%; justify-content: flex-end; }
      main { margin: 10px auto 20px; gap: 10px; }
      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }
      .controls .field:first-child,
      .controls .field:nth-child(2),
      .controls .field:nth-child(3) {
        grid-column: 1 / -1;
      }
      .field {
        height: 38px;
        padding: 0 9px;
        font-size: 13px;
      }
      .field .icon { width: 15px; height: 15px; }
      .calendar-panel { padding: 9px 10px; }
      .calendar-head { margin-bottom: 9px; }
      .calendar-day { min-height: 34px; font-size: 12px; }
      .calendar-grid { gap: 3px; }
      .table-wrap {
        display: block;
        overflow: visible;
        border-radius: 8px;
      }
      .table-wrap::after { display: none; }
      table {
        min-width: 0;
        width: 100%;
        table-layout: fixed;
      }
      th {
        height: 30px;
        padding: 0 2px;
        font-size: 11px;
        line-height: 1.1;
      }
      .period {
        width: 30px;
        min-width: 30px;
        font-size: 11px;
      }
      .slot {
        min-height: 0;
        height: 49px;
        padding: 3px;
      }
      .lesson {
        min-height: 42px;
        border-radius: 6px;
        padding: 3px 2px;
        gap: 2px;
      }
      .lesson-title {
        width: 100%;
        font-size: 10px;
        line-height: 1.18;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .lesson-sub {
        gap: 2px;
        line-height: 1;
      }
      .student-button {
        max-width: 100%;
        padding: 1px 3px;
        border-radius: 5px;
        font-size: 9px;
        line-height: 1.15;
        white-space: nowrap;
      }
      .mobile-list { display: none; }
      .day-title { padding: 10px 12px; font-size: 15px; }
      .mobile-row { grid-template-columns: 38px minmax(0, 1fr); gap: 8px; padding: 9px 10px; }
      .student-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 420px) {
      .topbar-inner, main { width: min(100% - 12px, 1220px); }
      .school-mark { width: 36px; height: 36px; }
      h1 { font-size: 19px; }
      .subtitle { font-size: 11px; }
      .button.icon-only { width: 34px; min-height: 34px; }
      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .field { height: 34px; font-size: 12px; }
      .calendar-toggle { min-height: 30px; }
      .calendar-title { font-size: 14px; }
      .calendar-button { width: 30px; height: 30px; }
      .calendar-button.today-button { padding: 0 8px; font-size: 11px; }
      th { height: 27px; font-size: 10px; }
      .period { width: 25px; min-width: 25px; font-size: 10px; }
      .slot { height: 43px; padding: 2px; }
      .lesson { min-height: 38px; padding: 2px 1px; }
      .lesson-title { font-size: 9px; line-height: 1.12; }
      .student-button { font-size: 8px; padding: 1px 2px; }
    }

    @media print {
      body { background: #fff; }
      .topbar, .controls, .calendar-panel, .status, .mobile-list, .modal-backdrop { display: none !important; }
      main { width: 100%; margin: 0; }
      .table-wrap { box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-lockup">
        <img class="school-mark" src="https://i.imgur.com/Mo4ogKc.png" alt="학교 마크">
        <div class="brand-copy">
          <h1 id="title">2026-2학기 교사 시간표</h1>
          <p class="subtitle" id="subtitle">Google Sheet 원본/수강현황 기준</p>
        </div>
      </div>
      <div class="toolbar">
        <button class="button icon-only" id="refreshBtn" type="button" title="새로고침" aria-label="새로고침">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-9 9 9.4 9.4 0 0 1-6.4-2.6"/><path d="M3 12a9 9 0 0 1 9-9 9.4 9.4 0 0 1 6.4 2.6"/><path d="M3 18h5v-5"/><path d="M21 6h-5v5"/></svg>
        </button>
        <button class="button icon-only" id="printBtn" type="button" title="인쇄" aria-label="인쇄">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="조회 조건">
      <label class="field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="teacherSearchInput" type="search" placeholder="교사 이름 검색" autocomplete="off">
      </label>
      <label class="field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        <select id="teacherSelect" aria-label="교사 선택"></select>
      </label>
      <label class="field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="search" placeholder="과목, 블록 검색" autocomplete="off">
      </label>
      <label class="field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
        <select id="dayFilter" aria-label="요일 선택"></select>
      </label>
      <label class="field">

  <script>
    const SHEET_ID = "1T1Dh0cqo3UwC_pkLpGBAVE5wIjJbOV8NMEWbCQ78qps";
    const SHEETS = { original: "원본(818)", enroll: "수강현황(818)" };
    const DAYS = ["월", "화", "수", "목", "금"];
    const DAY_STARTS = { "월": 4, "화": 12, "수": 20, "목": 28, "금": 36 };
    const PERIODS = ["1", "2", "3", "4", "5", "6", "7", "8"];
    const PLAIN_BLOCK_RE = /^[A-H]+$/;
    const GRADE_BLOCK_RE = /^([1-3](?:,[1-3])?)\/([A-Za-z][A-Za-z0-9]*)$/;
    const ROSTER_SHEETS = ["1h", "A~H", "2M", "3M", "3V"];

    const state = {
      teachers: [],
      enrollByTeacherGradeBlock: new Map(),
      rosterByKey: new Map(),
      lessonDetails: new Map(),
      nextLessonId: 1,
      selectedTeacher: "",
      loadedAt: null,
      selectedDate: new Date(),
      calendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1)
    };

    const els = {
      title: document.getElementById("title"),
      subtitle: document.getElementById("subtitle"),
      refreshBtn: document.getElementById("refreshBtn"),
      printBtn: document.getElementById("printBtn"),
      teacherSearchInput: document.getElementById("teacherSearchInput"),
      teacherSelect: document.getElementById("teacherSelect"),
      searchInput: document.getElementById("searchInput"),
      dayFilter: document.getElementById("dayFilter"),
      periodFilter: document.getElementById("periodFilter"),
      statusBox: document.getElementById("statusBox"),
      spinner: document.getElementById("spinner"),
      statusText: document.getElementById("statusText"),
      tableHead: document.getElementById("tableHead"),
      tableBody: document.getElementById("tableBody"),
      mobileList: document.getElementById("mobileList"),
      calendarPanel: document.getElementById("calendarPanel"),
      calendarToggleBtn: document.getElementById("calendarToggleBtn"),
      calendarTitle: document.getElementById("calendarTitle"),
      calendarGrid: document.getElementById("calendarGrid"),
      calendarTodayBtn: document.getElementById("calendarTodayBtn"),
      calendarPrevBtn: document.getElementById("calendarPrevBtn"),
      calendarNextBtn: document.getElementById("calendarNextBtn"),
      studentModal: document.getElementById("studentModal"),
      studentModalTitle: document.getElementById("studentModalTitle"),
      studentModalMeta: document.getElementById("studentModalMeta"),
      studentModalClose: document.getElementById("studentModalClose"),
      studentList: document.getElementById("studentList")
    };

    function normalize(value) {
      return String(value ?? "").replace(/\u3000/g, " ").replace(/\r/g, "\n").trim();
    }

    function compact(value) {
      return normalize(value).replace(/\s+/g, "");
    }

    function formatGradeBlock(value) {
      const compacted = compact(value);
      const match = compacted.match(GRADE_BLOCK_RE);
      if (!match) return compacted;
      const grades = match[1].replace(/,/g, "");
      return `${grades}${match[2]}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(value) {
      return String(value ?? "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function cellValue(cell) {
      if (!cell) return "";
      return normalize(cell.f ?? cell.v ?? "");
    }

    function gvizLoad(sheetName) {
      return new Promise((resolve, reject) => {
        const callback = `__gviz_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const tqx = `out:json;responseHandler:${callback}`;
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=${encodeURIComponent(tqx)}&sheet=${encodeURIComponent(sheetName)}&cache=${Date.now()}`;

        window[callback] = (response) => {
          cleanup();
          if (response.status && response.status !== "ok") {
            reject(new Error(response.errors?.[0]?.detailed_message || response.status));
            return;
          }
          resolve(response.table);
        };

        function cleanup() {
          delete window[callback];
          script.remove();
        }

        script.onerror = () => {
          cleanup();
          reject(new Error(`${sheetName} 시트를 불러오지 못했습니다.`));
        };

        script.src = url;
        document.head.appendChild(script);
      });
    }

    function tableRows(table) {
      return table.rows.map((row) => {
        return Array.from({ length: table.cols.length }, (_, index) => cellValue(row.c[index]));
      });
    }

    function buildEnrollment(rows) {
      const map = new Map();

      rows.forEach((row) => {
        const gradeCell = normalize(row[1]).replace(/\.0$/, "");
        const subject = normalize(row[2]);
        const blockCell = compact(row[4]);
        const teacher = normalize(row[5]);
        const student = normalize(row[6]);
        const code = compact(row[8]);

        if (!subject || !teacher) return;

        let grades = "";
        let block = blockCell;
        const codePattern = new RegExp(`^${escapeRegExp(compact(teacher))}([1-3](?:,[1-3])?|[1-3]{2,3})\\/?([A-Za-z][A-Za-z0-9]*)$`);
        const codeMatch = code.match(codePattern);

        if (codeMatch) {
          grades = codeMatch[1].replace(/,/g, "");
          block = codeMatch[2];
        } else if (/^\d+$/.test(gradeCell) && block) {
          grades = gradeCell;
        }

        if (!grades || !block) return;

        const key = `${teacher}|${grades}|${block.toUpperCase()}`;
        if (!map.has(key)) {
          map.set(key, { teacher, grades, block, subject, students: new Set() });
        }
        if (student) map.get(key).students.add(student);
      });

      return map;
    }

    function buildTeachers(rows) {
      return rows
        .slice(4)
        .map((row) => {
          const teacher = normalize(row[2]);
          if (!teacher) return null;
          const department = normalize(row[0]);
          const subject = normalize(row[1]);
          const office = normalize(row[3]).replace(/\n+/g, " ");
          const cells = [];

          DAYS.forEach((day) => {
            const start = DAY_STARTS[day];
            PERIODS.forEach((period, index) => {
              const raw = normalize(row[start + index]);
              cells.push({ day, period, raw, lessons: parseRawSlotV3(raw, teacher) });
            });
          });

          return { teacher, department, subject, office, cells };
        })
        .filter(Boolean)
        .sort((a, b) => a.teacher.localeCompare(b.teacher, "ko"));
    }

    function parseRawSlot(raw, teacher) {
      const value = compact(raw);
      if (!value) return [];
      if (/애국|애조/.test(value)) return [{ text: "애국조회", subject: "", matched: false, studentCount: 0, students: [], raw }];

      if (PLAIN_BLOCK_RE.test(value)) {
        return [{ text: value, subject: "", matched: false, studentCount: 0, students: [], raw }];
      }

      const gradeBlock = value.match(/^([1-3])\/?([A-Za-z][A-Za-z0-9]*)$/);
      if (gradeBlock) return [lessonFromParts(teacher, gradeBlock[1], gradeBlock[2], `${gradeBlock[1]}${gradeBlock[2]}`, raw)];

      return value.split(/[\/,+]/).filter(Boolean).map((part) => {
        if (PLAIN_BLOCK_RE.test(part)) return { text: part, subject: "", matched: false, studentCount: 0, students: [], raw };
        const match = part.match(/^([1-3])([A-Za-z][A-Za-z0-9]*)$/);
        if (match) return lessonFromParts(teacher, match[1], match[2], `${match[1]}${match[2]}`, raw);
        return lessonFromBlockOnly(teacher, part, raw);
      });
    }

    function lessonFromParts(teacher, grade, block, display, raw) {
      const found = state.enrollByTeacherGradeBlock.get(`${teacher}|${grade}|${block.toUpperCase()}`);
      return {
        text: found ? `${display}(${found.subject})` : display,
        subject: found?.subject || "",
        matched: Boolean(found),
        studentCount: found?.students.size || 0,
        students: found ? [...found.students].sort((a, b) => a.localeCompare(b, "ko")) : [],
        raw
      };
    }

    function lessonFromBlockOnly(teacher, block, raw) {
      const normalizedBlock = block.toUpperCase();
      const candidates = [];
      state.enrollByTeacherGradeBlock.forEach((value) => {
        if (value.teacher === teacher && value.block.toUpperCase() === normalizedBlock) candidates.push(value);
      });

      const subjects = [...new Set(candidates.map((item) => item.subject))];
      if (subjects.length === 1) {
        const studentCount = candidates.reduce((sum, item) => sum + item.students.size, 0);
        const students = [...new Set(candidates.flatMap((item) => [...item.students]))].sort((a, b) => a.localeCompare(b, "ko"));
        return { text: `${block}(${subjects[0]})`, subject: subjects[0], matched: true, studentCount, students, raw };
      }

      return { text: block, subject: "", matched: false, studentCount: 0, students: [], raw };
    }

    function parseRawSlotV2(raw, teacher) {
      const value = compact(raw);
      if (!value) return [];
      if (/애국|애조/.test(value)) return [{ text: "애국조회", subject: "", matched: false, studentCount: 0, students: [], raw }];

      if (PLAIN_BLOCK_RE.test(value)) {
        return [{ text: value, subject: "", matched: false, studentCount: 0, students: [], raw }];
      }

      const gradeBlock = value.match(GRADE_BLOCK_RE);
      if (gradeBlock) {
        return [lessonFromPartsV2(teacher, gradeBlock[1].replace(/,/g, ""), gradeBlock[2], formatGradeBlock(value), raw)];
      }

      return value.split(/[\/,+]/).filter(Boolean).map((part) => {
        const normalizedPart = compact(part);
        if (PLAIN_BLOCK_RE.test(normalizedPart)) return { text: normalizedPart, subject: "", matched: false, studentCount: 0, students: [], raw };
        const partGradeBlock = normalizedPart.match(GRADE_BLOCK_RE);
        if (partGradeBlock) {
          return lessonFromPartsV2(teacher, partGradeBlock[1].replace(/,/g, ""), partGradeBlock[2], formatGradeBlock(normalizedPart), raw);
        }
        const noSlashGradeBlock = normalizedPart.match(/^([1-3]{2,3})([A-Za-z][A-Za-z0-9]*)$/);
        if (noSlashGradeBlock) return lessonFromPartsV2(teacher, noSlashGradeBlock[1], noSlashGradeBlock[2], `${noSlashGradeBlock[1]}${noSlashGradeBlock[2]}`, raw);
        return lessonFromBlockOnlyV2(teacher, normalizedPart, raw);
      });
    }

    function lessonFromPartsV2(teacher, grade, block, display, raw) {
      const found = state.enrollByTeacherGradeBlock.get(`${teacher}|${grade}|${block.toUpperCase()}`);
      const rosterSections = /^[a-z]/.test(block) ? collectRosterSections(display) : [];
      const fallbackStudents = found ? [...found.students].sort((a, b) => a.localeCompare(b, "ko")) : [];
      const sections = rosterSections.length
        ? rosterSections
        : (fallbackStudents.length ? [{ sheetName: "legacy", label: display, students: fallbackStudents }] : []);
      const students = [...new Set(sections.flatMap((section) => section.students))];
      return {
        text: found ? `${display}(${found.subject})` : display,
        subject: found?.subject || "",
        matched: Boolean(found),
        studentCount: students.length,
        students,
        rosterSections: sections,
        raw
      };
    }

    function lessonFromBlockOnlyV2(teacher, block, raw) {
      const normalizedBlock = block.toUpperCase();
      const candidates = [];
      state.enrollByTeacherGradeBlock.forEach((value) => {
        if (value.teacher === teacher && value.block.toUpperCase() === normalizedBlock) candidates.push(value);
      });

      const subjects = [...new Set(candidates.map((item) => item.subject))];
      if (subjects.length === 1) {
        const studentCount = candidates.reduce((sum, item) => sum + item.students.size, 0);
        const students = [...new Set(candidates.flatMap((item) => [...item.students]))].sort((a, b) => a.localeCompare(b, "ko"));
        const rosterSections = /^[a-z]/.test(block) ? collectRosterSections(block) : [];
        const sections = rosterSections.length ? rosterSections : [{ sheetName: "legacy", label: block, students }];
        const rosterStudents = [...new Set(sections.flatMap((section) => section.students))];
        return { text: `${block}(${subjects[0]})`, subject: subjects[0], matched: true, studentCount: rosterStudents.length, students: rosterStudents, rosterSections: sections, raw };
      }

      const rosterSections = /^[a-z]/.test(block) ? collectRosterSections(block) : [];
      const sections = rosterSections.length ? rosterSections : [];
      const rosterStudents = [...new Set(sections.flatMap((section) => section.students))];
      return { text: block, subject: "", matched: false, studentCount: rosterStudents.length, students: rosterStudents, rosterSections: sections, raw };
    }

    function buildRosterIndex(tableMap) {
      const index = new Map();

      ROSTER_SHEETS.forEach((sheetName) => {
        const rows = tableMap.get(sheetName);
        if (!rows || !rows.length) return;

        const headers = rows[0].map((cell) => compact(cell));
        headers.forEach((header, columnIndex) => {
          if (!header) return;
          const students = [];
          rows.slice(1).forEach((row) => {
            const name = normalize(row[columnIndex]);
            if (name && !students.includes(name)) students.push(name);
          });
          index.set(`${sheetName.toLowerCase()}|${header.toLowerCase()}`, {
            sheetName,
            label: header,
            students
          });
        });
      });

      return index;
    }

    function collectRosterSections(token) {
      const cleaned = compact(String(token || "").replace(/\(.*\)$/, ""));
      if (!cleaned) return [];

      const sections = [];
      const pushSection = (sheetName, label) => {
        const key = `${sheetName.toLowerCase()}|${label.toLowerCase()}`;
        const section = state.rosterByKey.get(key);
        if (section && !sections.some((item) => item.sheetName === section.sheetName && item.label === section.label)) {
          sections.push({ ...section });
        }
      };

      const pushExact = (label) => {
        [...state.rosterByKey.values()].forEach((section) => {
          if (section.label.toLowerCase() === label.toLowerCase()) pushSection(section.sheetName, section.label);
        });
      };

      const expandPackedModules = (text) => {
        const normalized = text.toLowerCase();
        const groups = [];
        const pattern = /([23])?([mv])([0-9]+)/g;
        let currentGrade = "";
        let match;
        while ((match = pattern.exec(normalized))) {
          if (match[1]) currentGrade = match[1];
          if (!currentGrade) continue;
          match[3].split("").forEach((digit) => groups.push(`${currentGrade}${match[2]}${digit}`));
        }
        return groups;
      };

      pushExact(cleaned);
      if (sections.length) return sections;

      const packedModules = expandPackedModules(cleaned);
      if (packedModules.length) {
        packedModules.forEach(pushExact);
        return sections;
      }

      if (/^1h\d+$/i.test(cleaned)) {
        pushSection("1h", `h${cleaned.replace(/^1h/i, "")}`);
        return sections;
      }

      if (/^[A-H]+$/.test(cleaned)) {
        if (cleaned.length > 1) {
          cleaned.split("").forEach((letter) => pushSection("A~H", letter));
        } else {
          pushSection("A~H", cleaned);
        }
        return sections;
      }

      if (/^2M$/i.test(cleaned)) {
        [...state.rosterByKey.values()].filter((item) => item.sheetName === "2M").forEach((item) => sections.push({ ...item }));
        return sections;
      }

      if (/^3M$/i.test(cleaned)) {
        [...state.rosterByKey.values()].filter((item) => item.sheetName === "3M").forEach((item) => sections.push({ ...item }));
        return sections;
      }

      if (/^3V$/i.test(cleaned)) {
        [...state.rosterByKey.values()].filter((item) => item.sheetName === "3V").forEach((item) => sections.push({ ...item }));
        return sections;
      }

      return sections;
    }

    function plainRosterLesson(value, raw) {
      const rosterSections = collectRosterSections(value);
      const students = [...new Set(rosterSections.flatMap((section) => section.students))];
      return { text: value, subject: "", matched: false, studentCount: students.length, students, rosterSections, raw };
    }

    function rosterModuleLesson(value, teacher, raw) {
      const rosterSections = collectLowercaseModuleSections(value);
      const students = [...new Set(rosterSections.flatMap((section) => section.students))];
      const moduleMatch = value.match(/^([23])([mv])/);
      const subjectBlock = moduleMatch ? moduleMatch[2] : "";
      const subjectKey = moduleMatch && subjectBlock
        ? `${teacher}|${moduleMatch[1]}|${subjectBlock.toUpperCase()}`
        : "";
      const found = subjectKey ? state.enrollByTeacherGradeBlock.get(subjectKey) : null;
      return {
        text: found ? `${value}(${found.subject})` : value,
        subject: found?.subject || "",
        matched: Boolean(found),
        studentCount: students.length,
        students,
        rosterSections,
        raw
      };
    }

    function collectLowercaseModuleSections(token) {
      const cleaned = compact(token);
      const sections = [];
      const add = (sheetName, label) => {
        const section = state.rosterByKey.get(`${sheetName.toLowerCase()}|${label.toLowerCase()}`);
        if (section && !sections.some((item) => item.sheetName === section.sheetName && item.label.toLowerCase() === section.label.toLowerCase())) {
          sections.push({ ...section });
        }
      };

      const addNumbers = (grade, kind, digits) => {
        const sheetName = grade === "3" && kind === "v" ? "3V" : `${grade}M`;
        let rest = digits;
        while (rest) {
          const twoDigitLabel = `${grade}${kind}${rest.slice(0, 2)}`;
          if (rest.length >= 2 && state.rosterByKey.has(`${sheetName.toLowerCase()}|${twoDigitLabel.toLowerCase()}`)) {
            add(sheetName, twoDigitLabel);
            rest = rest.slice(2);
          } else {
            add(sheetName, `${grade}${kind}${rest[0]}`);
            rest = rest.slice(1);
          }
        }
      };

      const pattern = /([23])?([mv])([0-9]+)/g;
      let currentGrade = "";
      let match;
      while ((match = pattern.exec(cleaned))) {
        if (match[1]) currentGrade = match[1];
        if (currentGrade) addNumbers(currentGrade, match[2], match[3]);
      }

      return sections;
    }

    function parseRawSlotV3(raw, teacher) {
      const value = compact(raw);
      if (!value) return [];
      if (/애국|애조/.test(value)) return [{ text: "애국조회", subject: "", matched: false, studentCount: 0, students: [], rosterSections: [], raw }];

      if (PLAIN_BLOCK_RE.test(value)) return [plainRosterLesson(value, raw)];

      const lowercaseModule = value.match(/^[23][mv]\d{1,2}$/);
      if (lowercaseModule) return [rosterModuleLesson(value, teacher, raw)];

      const packedLowercaseModules = value.match(/^[23][mv]\d+[mv]\d+$/);
      if (packedLowercaseModules) return [rosterModuleLesson(value, teacher, raw)];

      const gradeBlock = value.match(GRADE_BLOCK_RE);
      if (gradeBlock) {
        return [lessonFromPartsV2(teacher, gradeBlock[1].replace(/,/g, ""), gradeBlock[2], formatGradeBlock(value), raw)];
      }

      const hBlock = value.match(/^1h(10|[1-9])$/i);
      if (hBlock) return [plainRosterLesson(value, raw)];

      const slashlessMultiGradeBlock = value.match(/^([1-3]{2,3})([A-Za-z][A-Za-z0-9]*)$/);
      if (slashlessMultiGradeBlock) {
        return [lessonFromPartsV2(teacher, slashlessMultiGradeBlock[1], slashlessMultiGradeBlock[2], `${slashlessMultiGradeBlock[1]}${slashlessMultiGradeBlock[2]}`, raw)];
      }

      return value.split(/[+]/).filter(Boolean).map((part) => {
        const normalizedPart = compact(part);
        if (PLAIN_BLOCK_RE.test(normalizedPart) || /^1h(10|[1-9])$/i.test(normalizedPart)) return plainRosterLesson(normalizedPart, raw);
        const partGradeBlock = normalizedPart.match(GRADE_BLOCK_RE);
        if (partGradeBlock) {
          return lessonFromPartsV2(teacher, partGradeBlock[1].replace(/,/g, ""), partGradeBlock[2], formatGradeBlock(normalizedPart), raw);
        }
        const noSlashGradeBlock = normalizedPart.match(/^([1-3]{2,3})([A-Za-z][A-Za-z0-9]*)$/);
        if (noSlashGradeBlock) return lessonFromPartsV2(teacher, noSlashGradeBlock[1], noSlashGradeBlock[2], `${noSlashGradeBlock[1]}${noSlashGradeBlock[2]}`, raw);
        return lessonFromBlockOnlyV2(teacher, normalizedPart, raw);
      });
    }

    function setStatus(message, type = "loading") {
      els.statusBox.className = `status ${message ? "visible" : ""} ${type === "error" ? "error" : ""}`;
      els.spinner.style.display = type === "loading" ? "inline-block" : "none";
      els.statusText.textContent = message;
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function selectedDayName() {
      return ["일", "월", "화", "수", "목", "금", "토"][state.selectedDate.getDay()];
    }

    function selectedScheduleDay() {
      const weekDay = state.selectedDate.getDay();
      return weekDay >= 1 && weekDay <= 5 ? DAYS[weekDay - 1] : "";
    }

    function setCalendarCollapsed(collapsed) {
      els.calendarPanel.classList.toggle("is-collapsed", collapsed);
      els.calendarToggleBtn.setAttribute("aria-expanded", String(!collapsed));
    }

    function moveSelectedDate(days) {
      const nextDate = new Date(state.selectedDate);
      nextDate.setDate(nextDate.getDate() + days);
      state.selectedDate = nextDate;
      state.calendarMonth = new Date(nextDate.getFullYear(), nextDate.getMonth(), 1);
      renderCalendar();
      render();
    }

    function renderCalendar() {
      const year = state.calendarMonth.getFullYear();
      const month = state.calendarMonth.getMonth();
      const firstDay = new Date(year, month, 1);
      const gridStart = new Date(year, month, 1 - firstDay.getDay());
      const selectedKey = dateKey(state.selectedDate);
      const todayKey = dateKey(new Date());
      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];

      els.calendarTitle.textContent = `${year}년 ${month + 1}월`;
      els.calendarGrid.innerHTML = weekdays.map((day, index) => `<div class="calendar-weekday ${index === 0 ? "sunday" : ""}">${day}</div>`).join("");

      for (let index = 0; index < 42; index += 1) {
        const date = new Date(gridStart);
        date.setDate(gridStart.getDate() + index);
        const key = dateKey(date);
        const classes = [
          "calendar-day",
          date.getMonth() !== month ? "other-month" : "",
          date.getDay() === 0 ? "sunday" : "",
          key === todayKey ? "today" : "",
          key === selectedKey ? "selected" : ""
        ].filter(Boolean).join(" ");
        els.calendarGrid.insertAdjacentHTML("beforeend", `<button class="${classes}" type="button" data-date="${key}">${date.getDate()}</button>`);
      }
    }

    function selectedTeacherData() {
      return state.teachers.find((item) => item.teacher === state.selectedTeacher) || null;
    }

    function filteredTeachers() {
      const query = normalize(els.teacherSearchInput.value).toLowerCase();
      if (!query) return state.teachers;
      return state.teachers.filter((item) => item.teacher.toLowerCase().includes(query));
    }

    function updateTeacherOptions() {
      const teachers = filteredTeachers();
      const query = normalize(els.teacherSearchInput.value);

      if (!teachers.length) {
        els.teacherSelect.innerHTML = `<option value="">검색 결과 없음</option>`;
        state.selectedTeacher = "";
        return false;
      }

      els.teacherSelect.innerHTML = teachers
        .map((item) => `<option value="${escapeHtml(item.teacher)}">${escapeHtml(item.teacher)}</option>`)
        .join("");

      const exact = query ? teachers.find((item) => item.teacher === query) : null;
      const preferred = exact
        || teachers.find((item) => item.teacher === state.selectedTeacher)
        || (teachers.length === 1 ? teachers[0] : null)
        || teachers[0];

      state.selectedTeacher = preferred.teacher;
      els.teacherSelect.value = state.selectedTeacher;
      return true;
    }

    function populateControls() {
      const currentTeacher = state.selectedTeacher;
      const preferred = state.teachers.find((item) => item.teacher === currentTeacher)
        || state.teachers.find((item) => item.teacher === "김태완")
        || state.teachers[0];

      state.selectedTeacher = preferred?.teacher || "";
      updateTeacherOptions();

      els.dayFilter.innerHTML = `<option value="">전체 요일</option>${DAYS.map((day) => `<option value="${day}">${day}요일</option>`).join("")}`;
      els.periodFilter.innerHTML = `<option value="">전체 교시</option>${PERIODS.map((period) => `<option value="${period}">${period}교시</option>`).join("")}`;
    }

    function slotMatches(cell) {
      const day = els.dayFilter.value;
      const period = els.periodFilter.value;
      const query = normalize(els.searchInput.value).toLowerCase();
      const haystack = [cell.day, cell.period, cell.raw, ...cell.lessons.map((lesson) => `${lesson.text} ${lesson.subject}`)].join(" ").toLowerCase();

      return (!day || cell.day === day) && (!period || cell.period === period) && (!query || haystack.includes(query));
    }

    function renderLesson(cell) {
      if (!cell.raw) return `<div class="lesson empty">-</div>`;
      if (!cell.lessons.length) return `<div class="lesson"><div class="lesson-title">${escapeHtml(cell.raw)}</div></div>`;
      const studentButtons = cell.lessons
        .filter((lesson) => lesson.studentCount && ((lesson.rosterSections && lesson.rosterSections.length) || lesson.students.length))
        .map((lesson) => {
          const id = registerLessonDetail(lesson, cell);
          return `<button class="student-button" type="button" data-lesson-id="${id}">수강인원 ${lesson.studentCount}명</button>`;
        })
        .join("");
      return `<div class="lesson">
        <div class="lesson-title">${cell.lessons.map((lesson) => escapeHtml(lesson.text)).join(" · ")}</div>
        ${studentButtons ? `<div class="lesson-sub">${studentButtons}</div>` : ""}
      </div>`;
    }

    function registerLessonDetailOld(lesson, cell) {
      const id = String(state.nextLessonId++);
      state.lessonDetails.set(id, {
        title: lesson.text,
        meta: `${cell.day}요일 ${cell.period}교시 · 수강인원 ${lesson.studentCount}명`,
        students: lesson.students
      });
      return id;
    }

    function openStudentModalOld(id) {
      const detail = state.lessonDetails.get(id);
      if (!detail || !detail.students.length) return;
      els.studentModalTitle.textContent = detail.title;
      els.studentModalMeta.textContent = detail.meta;
      els.studentList.innerHTML = detail.students.map((student) => `<li>${escapeHtml(student)}</li>`).join("");
      els.studentModal.classList.add("visible");
      els.studentModalClose.focus();
    }

    function registerLessonDetail(lesson, cell) {
      const id = String(state.nextLessonId++);
      const sections = lesson.rosterSections && lesson.rosterSections.length
        ? lesson.rosterSections
        : (lesson.students.length ? [{ sheetName: "legacy", label: lesson.text, students: lesson.students }] : []);
      const count = [...new Set(sections.flatMap((section) => section.students))].length;
      state.lessonDetails.set(id, {
        title: lesson.text,
        meta: `${cell.day}요일 ${cell.period}교시 · 수강인원 ${count}명`,
        sections
      });
      return id;
    }

    function openStudentModal(id) {
      const detail = state.lessonDetails.get(id);
      if (!detail || !detail.sections.length) return;
      els.studentModalTitle.textContent = detail.title;
      els.studentModalMeta.textContent = `${detail.meta} · ${detail.sections.length}개 구간`;
      els.studentList.innerHTML = detail.sections.map((section) => `
        <li class="student-group">
          <h3>${escapeHtml(section.label)} · ${section.students.length}명</h3>
          <ol>
            ${section.students.map((student) => `<li>${escapeHtml(student)}</li>`).join("")}
          </ol>
        </li>
      `).join("");
      els.studentModal.classList.add("visible");
      els.studentModalClose.focus();
    }

    function closeStudentModal() {
      els.studentModal.classList.remove("visible");
    }

    function render() {
      const teacher = selectedTeacherData();
      const activeDay = selectedScheduleDay();
      if (!teacher) {
        els.title.textContent = "교사 시간표";
        els.subtitle.textContent = "검색 결과가 없습니다.";
        els.tableHead.innerHTML = `<tr><th class="period">교시</th>${DAYS.map((day) => `<th class="${day === activeDay ? "selected-day" : ""}">${day}요일</th>`).join("")}</tr>`;
        els.tableBody.innerHTML = PERIODS.map((period) => {
          return `<tr><td class="period">${period}</td>${DAYS.map((day) => `<td class="slot${day === activeDay ? " selected-day" : ""}"><div class="lesson empty">-</div></td>`).join("")}</tr>`;
        }).join("");
        els.mobileList.innerHTML = "";
        return;
      }

      const visible = teacher.cells.filter(slotMatches);
      const visibleKeys = new Set(visible.map((cell) => `${cell.day}|${cell.period}`));
      state.lessonDetails = new Map();
      state.nextLessonId = 1;

      els.title.textContent = `${teacher.teacher} 시간표`;
      els.subtitle.textContent = `${teacher.office || "교무실 정보 없음"} · ${state.loadedAt.toLocaleString("ko-KR")} 업데이트`;

      els.tableHead.innerHTML = `<tr><th class="period">교시</th>${DAYS.map((day) => `<th class="${day === activeDay ? "selected-day" : ""}">${day}요일</th>`).join("")}</tr>`;
      els.tableBody.innerHTML = PERIODS.map((period) => {
        const tds = DAYS.map((day) => {
          const cell = teacher.cells.find((item) => item.day === day && item.period === period);
          const visibleStyle = visibleKeys.has(`${day}|${period}`) ? "" : "opacity:0.18";
          return `<td class="slot${day === activeDay ? " selected-day" : ""}" style="${visibleStyle}">${renderLesson(cell)}</td>`;
        }).join("");
        return `<tr><td class="period">${period}</td>${tds}</tr>`;
      }).join("");

      els.mobileList.innerHTML = DAYS.map((day) => {
        const rows = PERIODS.map((period) => teacher.cells.find((item) => item.day === day && item.period === period))
          .filter((cell) => cell && slotMatches(cell))
          .map((cell) => `<div class="mobile-row"><div class="mobile-period">${cell.period}</div><div>${renderLesson(cell)}</div></div>`)
          .join("");
        return `<article class="day-card${day === activeDay ? " selected-day-card" : ""}"><h2 class="day-title">${day}요일</h2>${rows || `<div class="mobile-row"><div></div><div class="lesson empty">-</div></div>`}</article>`;
      }).join("");
    }

    async function loadData() {
      els.refreshBtn.disabled = true;
      setStatus("Google Sheet에서 원본/수강현황 데이터를 불러오는 중입니다.");

      try {
        const [originalTable, enrollTable, ...rosterTables] = await Promise.all([
          gvizLoad(SHEETS.original),
          gvizLoad(SHEETS.enroll),
          ...ROSTER_SHEETS.map((sheetName) => gvizLoad(sheetName))
        ]);
        const rosterRowsBySheet = new Map(ROSTER_SHEETS.map((sheetName, index) => [sheetName, tableRows(rosterTables[index])]));
        state.rosterByKey = buildRosterIndex(rosterRowsBySheet);
        state.enrollByTeacherGradeBlock = buildEnrollment(tableRows(enrollTable));
        state.teachers = buildTeachers(tableRows(originalTable));
        state.loadedAt = new Date();

        populateControls();
        render();
        setStatus("");
      } catch (error) {
        console.error(error);
        setStatus("데이터를 불러오지 못했습니다. Google Sheet 공유 권한과 탭 이름을 확인해 주세요.", "error");
      } finally {
        els.refreshBtn.disabled = false;
      }
    }

    els.teacherSelect.addEventListener("change", () => {
      state.selectedTeacher = els.teacherSelect.value;
      render();
    });
    els.teacherSearchInput.addEventListener("input", () => {
      updateTeacherOptions();
      render();
    });
    els.searchInput.addEventListener("input", render);
    els.dayFilter.addEventListener("change", render);
    els.periodFilter.addEventListener("change", render);
    els.refreshBtn.addEventListener("click", loadData);
    els.printBtn.addEventListener("click", () => window.print());
    els.calendarGrid.addEventListener("click", (event) => {
      const button = event.target.closest(".calendar-day[data-date]");
      if (!button) return;
      const [year, month, day] = button.dataset.date.split("-").map(Number);
      state.selectedDate = new Date(year, month - 1, day);
      state.calendarMonth = new Date(year, month - 1, 1);
      renderCalendar();
      render();
      setCalendarCollapsed(true);
    });
    els.calendarToggleBtn.addEventListener("click", () => {
      setCalendarCollapsed(!els.calendarPanel.classList.contains("is-collapsed"));
    });
    els.calendarPrevBtn.addEventListener("click", () => {
      moveSelectedDate(-1);
    });
    els.calendarNextBtn.addEventListener("click", () => {
      moveSelectedDate(1);
    });
    els.calendarTodayBtn.addEventListener("click", () => {
      const today = new Date();
      state.selectedDate = today;
      state.calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      renderCalendar();
      render();
      setCalendarCollapsed(true);
    });
    document.addEventListener("click", (event) => {
      const button = event.target.closest(".student-button");
      if (button) openStudentModal(button.dataset.lessonId);
    });
    els.studentModalClose.addEventListener("click", closeStudentModal);
    els.studentModal.addEventListener("click", (event) => {
      if (event.target === els.studentModal) closeStudentModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeStudentModal();
    });

    renderCalendar();
    loadData();
  </script>
</body>
</html>
